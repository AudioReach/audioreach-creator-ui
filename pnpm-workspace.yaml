packages:
  - packages/*

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@qualcomm-ui/core@1.11.8 || 1.12.0'
  - '@qualcomm-ui/dom@1.1.6 || 1.2.0'
  - '@qualcomm-ui/qds-core@1.35.1 || 1.36.0'
  - '@qualcomm-ui/react-core@1.5.10 || 1.6.0'
  - '@qualcomm-ui/react@1.27.5 || 1.28.0'
  - '@qualcomm-ui/utils@1.3.3 || 1.4.0'
  - electron@43.4.1

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - unrs-resolver
