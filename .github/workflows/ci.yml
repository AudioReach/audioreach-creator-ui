name: CI Workflow
on:
  pull_request:
    branches: [main, 'feature/*']
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Validation to run
        type: choice
        default: full
        options:
          - full
          - nightly

# This job only reads the repo and uploads artifacts; drop the default token
# down to read-only.
permissions:
  contents: read

# Cancel superseded runs for the same ref so a new push to a PR stops the
# previous in-flight run instead of queueing another full pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || inputs.mode || 'full' }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        if: github.event_name != 'schedule' && inputs.mode != 'nightly'
        run: pnpm lint

      - name: Type Check
        if: github.event_name != 'schedule' && inputs.mode != 'nightly'
        run: pnpm typecheck

      - name: Build
        if: github.event_name != 'schedule' && inputs.mode != 'nightly'
        run: pnpm build

      - name: Build Jest workspace dependency
        if: github.event_name == 'schedule' || inputs.mode == 'nightly'
        run: pnpm --filter @audioreach-creator-ui/api-utils build

      - name: Install XML report dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/report-tools"
          "$RUNNER_TEMP/report-tools/bin/python" -m pip install \
            --disable-pip-version-check -r .github/scripts/requirements.txt
          echo "$RUNNER_TEMP/report-tools/bin" >> "$GITHUB_PATH"

      - name: Test Jest packages
        id: test
        run: python3 .github/scripts/run_jest_packages.py

      - name: Merge Jest reports by package
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ui-test-artifacts
        run: python3 .github/scripts/run_jest_packages.py --merge --output "$ARTIFACT_DIR/test-results/merged-results.xml"

      - name: Merge coverage by package
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/ui-test-artifacts
        run: python3 .github/scripts/run_jest_packages.py --coverage --output "$ARTIFACT_DIR/coverage/clover.xml"

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        with:
          name: ui-jest-results-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-test-artifacts
          compression-level: 9
          retention-days: 3
          if-no-files-found: warn
