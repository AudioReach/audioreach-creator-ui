# This workflow is triggered on pull requests to main or feature branches, and can be manually triggered.
# It runs the CI pipeline on Ubuntu latest with Node.js version 22.
# The workflow checks out the code, sets up Node.js and pnpm, gets the pnpm store directory, and then runs the CI pipeline using pnpm.
# The workflow is designed to ensure that code changes are tested and validated before being merged into the main branch.
# It also allows for manual triggering of the workflow for testing purposes.
# The workflow uses a matrix strategy to run the pipeline on different Node.js versions, ensuring compatibility across different environments.

name: CI Workflow
on:
  pull_request:
    branches: [main, "feature/*"]
  workflow_dispatch:

# This job only reads the repo and uploads artifacts; drop the default token
# down to read-only.
permissions:
  contents: read

# Cancel superseded runs for the same ref so a new push to a PR stops the
# previous in-flight run instead of queueing another full pipeline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (React only)
        run: pnpm run -C packages/react-app test:ci

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: >-
          always() &&
          github.event.pull_request.head.repo.fork == false
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            packages/**/test-results/**/*
            packages/**/coverage/**/*
          retention-days: 5